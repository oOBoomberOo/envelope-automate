name: Release

on:
  push:
    tags:
      - "v*"
  # Lets you re-run a release without re-tagging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show artifacts
        run: ls -l build/libs

      - name: Validate mod metadata
        run: |
          python - <<'PY'
          import glob, tomllib, zipfile
          jars = glob.glob("build/libs/*.jar")
          assert jars, "no jar found in build/libs"
          for jar in jars:
              with zipfile.ZipFile(jar) as archive:
                  data = archive.read("META-INF/neoforge.mods.toml")
              meta = tomllib.loads(data.decode("utf-8"))
              assert meta.get("modLoader") == "javafml", f"{jar}: bad modLoader"
              mods = meta.get("mods") or []
              assert mods and mods[0].get("modId"), f"{jar}: no [[mods]]"
              print(f"{jar}: {mods[0]['modId']} {mods[0].get('version')}")
          PY

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
