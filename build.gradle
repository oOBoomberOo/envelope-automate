plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent { // Envelope
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent { // Mortaar (Envelope's library, bundled in its jar)
        forRepository {
            maven {
                name = 'mortuusars'
                url = 'https://raw.githubusercontent.com/mortuusars/resources/main/maven/'
            }
        }
        filter { includeGroup 'io.github.mortuusars.mortaar' }
    }
    exclusiveContent { // Sable companion (Envelope's library, bundled in its jar)
        forRepository {
            maven {
                name = 'ryanhcode'
                url = 'https://maven.ryanhcode.dev/releases/'
            }
        }
        filter { includeGroup 'dev.ryanhcode.sable-companion' }
    }
}

dependencies {
    implementation("maven.modrinth:envelope:${envelope_modrinth_version}") { transitive = false }
    implementation("io.github.mortuusars.mortaar:mortaar-${minecraft_version}-neoforge:${mortaar_version}") { transitive = false }
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            envelope_version_range : envelope_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Rejects UTF-8 byte order marks in hand-maintained text files.
// PowerShell's `Set-Content -Encoding utf8` writes one, and TOML/JSON parsers fail on it, which turned into a
// mod that would not load. Runs before the mod metadata is generated and as part of `check` (so in CI too).
var checkNoBom = tasks.register('checkNoBom') {
    group = 'verification'
    description = 'Fails if a text file starts with a UTF-8 byte order mark.'

    var textExtensions = ['.java', '.gradle', '.properties', '.toml', '.json', '.mcmeta', '.md', '.yml', '.yaml']
    var roots = [file('src'), file('.github')]
    var looseFiles = ['gradle.properties', 'settings.gradle', 'build.gradle', 'README.md'].collect { file(it) }

    outputs.upToDateWhen { false }
    doLast {
        var offenders = []
        var files = new ArrayList(looseFiles)
        roots.each { root ->
            if (!root.exists()) return
            if (root.isFile()) { files.add(root); return }
            root.eachFileRecurse { f -> if (f.isFile()) files.add(f) }
        }
        files.each { f ->
            if (!f.isFile() || !textExtensions.any { f.name.endsWith(it) }) return
            var head = new byte[3]
            var inStream = new FileInputStream(f)
            try {
                var read = inStream.read(head)
                if (read == 3 && (head[0] & 0xFF) == 0xEF && (head[1] & 0xFF) == 0xBB && (head[2] & 0xFF) == 0xBF) {
                    offenders.add(f.absolutePath)
                }
            } finally {
                inStream.close()
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("UTF-8 byte order mark found in:\n  " + offenders.join("\n  ")
                    + "\nSave these files as UTF-8 without BOM (do not use PowerShell's Set-Content -Encoding utf8).")
        }
    }
}

tasks.named('generateModMetadata') { dependsOn checkNoBom }
tasks.named('check') { dependsOn checkNoBom }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
